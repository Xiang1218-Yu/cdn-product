server:
  scheduler:
    host: "0.0.0.0"
    port: 8080
    grpc_port: 9090
  
etcd:
  endpoints:
    - "http://localhost:2379"
  dial_timeout: 5s
  
mongodb:
  uri: "mongodb://admin:password123@localhost:27017/?authSource=admin"
  database: "scheduler"
  timeout: 10s
  
prometheus:
  enabled: true
  port: 2112
  
log:
  level: "info"
  format: "json"
  
retry:
  max_attempts: 3
  initial_delay: 1s
  max_delay: 30s
  
executor:
  heartbeat_interval: 10s
  heartbeat_timeout: 30s