syntax = "proto3";

package scheduler;

option go_package = "github.com/scheduler/api/proto";

service ExecutorService {
    rpc ExecuteTask(TaskRequest) returns (TaskResponse);
    rpc GetTaskStatus(TaskStatusRequest) returns (TaskStatusResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message TaskRequest {
    string task_id = 1;
    string task_name = 2;
    string command = 3;
    map<string, string> params = 4;
    int64 timeout = 5;
}

message TaskResponse {
    string task_id = 1;
    bool success = 2;
    string output = 3;
    string error = 4;
    int64 duration = 5;
}

message TaskStatusRequest {
    string task_id = 1;
}

message TaskStatusResponse {
    string task_id = 1;
    string status = 2;
    string output = 3;
    string error = 4;
}

message HeartbeatRequest {
    string executor_id = 1;
    string address = 2;
    int32 capacity = 3;
    int32 load = 4;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}