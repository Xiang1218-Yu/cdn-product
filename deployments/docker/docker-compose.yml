version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: scheduler-etcd
    command: etcd -name etcd0 -listen-client-urls http://0.0.0.0:2379 -advertise-client-urls http://0.0.0.0:2379 -listen-peer-urls http://0.0.0.0:2380 -initial-advertise-peer-urls http://0.0.0.0:2380 -initial-cluster etcd0=http://0.0.0.0:2380 -initial-cluster-state new -initial-cluster-token etcd-cluster
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - scheduler-network

  mongodb:
    image: mongo:7.0
    container_name: scheduler-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - scheduler-network

  scheduler:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.scheduler
    container_name: scheduler-server
    ports:
      - "8080:8080"
      - "9090:9090"
      - "2112:2112"
    environment:
      - SCHEDULER_CONFIG=/app/configs/config.yaml
    depends_on:
      - etcd
      - mongodb
    networks:
      - scheduler-network
    restart: on-failure

  executor-1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.executor
    container_name: scheduler-executor-1
    environment:
      - EXECUTOR_ID=executor-1
      - SCHEDULER_ADDRESS=scheduler:9090
    depends_on:
      - scheduler
    networks:
      - scheduler-network
    restart: on-failure

  executor-2:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.executor
    container_name: scheduler-executor-2
    environment:
      - EXECUTOR_ID=executor-2
      - SCHEDULER_ADDRESS=scheduler:9090
    depends_on:
      - scheduler
    networks:
      - scheduler-network
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: scheduler-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - scheduler-network

  grafana:
    image: grafana/grafana:latest
    container_name: scheduler-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - scheduler-network

networks:
  scheduler-network:
    driver: bridge

volumes:
  mongodb-data:
  prometheus-data:
  grafana-data: